bundle:
  name: pricing-workbench

variables:
  catalog_name:
    description: Unity Catalog name for all demo tables
    default: lr_pricing_v2_aws_us_catalog
  schema_name:
    description: Schema name for all demo tables (everything lives in one schema)
    default: pricing_workbench
  volume_name:
    description: Volume for landing external data files
    default: external_landing
  entity_name:
    description: Name of the reporting undertaking
    default: "Bricksurance SE"
  warehouse_id:
    description: SQL warehouse used by the app for data queries
    default: ""
  app_service_principal_id:
    description: |
      The Databricks App's service principal (appId). Granted CAN_MANAGE_RUN on
      app-triggered jobs and CAN_USE on the warehouse. Empty on a first deploy —
      see README two-phase bootstrap: create the app, capture its SP, set this
      var, then redeploy so the grants attach.
    default: ""
  genie_space_id:
    description: AI/BI Genie space over the Modelling Mart (empty hides the tab)
    default: ""
  genie_quote_space_id:
    description: AI/BI Genie space over the quote stream (empty hides the tab)
    default: ""
  mart_dashboard_id:
    description: Lakeview dashboard powering the Modelling Mart tab (empty hides it)
    default: ""
  deploy_profile:
    description: |
      core = commercial rating engine + models + governance + agents + MCP/
      agentic buyer (scale-to-zero, no live feature table). full = also arms the
      optional live-serving tier (Lakebase online store + route-optimized scorer
      + QPS tester). NOTE: the live-serving jobs are always defined in the bundle
      but dormant — they cost nothing until run. This flag drives which tasks the
      "Full Build" orchestrator runs, not which resources exist.
    default: "core"
  live_online_store_name:
    description: Lakebase online store backing the optional Live Pricing System
    default: "pw-pricing-online-store"
  live_endpoint_name:
    description: Model Serving endpoint for the commercial rating engine
    default: "pw_pricing_scorer"
  scale_factor:
    description: |
      Multiplier on the synthetic dataset size (1 = 50k policies, 20 = 1M).
      Core needs only a modest dataset; the 1M size existed for the QPS speed
      demo in the live-serving tier.
    default: "1"

# v2 is the default target on this branch — a bare `bundle deploy` goes to the
# fresh v2 workspace, never to the legacy dev/prod estates. Pass --target
# explicitly to reach those.
targets:
  v2:
    mode: production
    default: true
    workspace:
      host: https://fevm-lr-pricing-v2-aws-us.cloud.databricks.com
      profile: PRICING_V2
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name:  lr_pricing_v2_aws_us_catalog
      schema_name:   pricing_workbench
      warehouse_id:  "f738fde9a1197aeb"
      # App SP minted when the app was (re)created on the v2 workspace (2026-08-17).
      app_service_principal_id: "8f20568f-50cc-4ed4-b119-8a532f9b2e6c"
      scale_factor:  "1"
      deploy_profile: "core"

  # --- legacy estates (not deployed from the v2 branch; kept for reference) ---
  dev:
    mode: development
    workspace:
      host: https://fevm-lr-dev-aws-us.cloud.databricks.com
      profile: DEV
    variables:
      catalog_name:        lr_dev_aws_us_catalog
      schema_name:         pricing_upt
      warehouse_id:        "a3b61648ea4809e3"
      app_service_principal_id: "63890164-4191-4196-9682-5248098a59c5"
      scale_factor:        "1"

  prod:
    mode: production
    workspace:
      host: https://fevm-lr-serverless-aws-us.cloud.databricks.com
      profile: DEFAULT
      root_path: /Workspace/Shared/.bundle/pricing-upt-demo/prod
    variables:
      catalog_name:        lr_serverless_aws_us_catalog
      schema_name:         pricing_upt
      warehouse_id:        "ab79eced8207d29b"
      app_service_principal_id: "3da451a3-ebd3-46be-a5fa-13132401d01a"
      genie_space_id:        "01f15d9ed6a61ca18f578f91ad1c76b7"
      genie_quote_space_id:  "01f15d9ed72c1a44aa4e4fe208de54c2"
      scale_factor:          "20"

sync:
  # app.yaml is generated by deploy.sh from app.<target>.yaml and is
  # .gitignored; force-include it so bundle sync (which honours .gitignore)
  # still ships it — the Apps runtime needs it for the uvicorn start command.
  include:
    - src/app/app.yaml
    # The built frontend is .gitignored (regenerated at deploy) but the Apps
    # runtime serves it statically — without it the SPA route never registers
    # and the app returns {"detail":"Not Found"}. Force-sync it.
    - src/app/frontend/dist/**
  exclude:
    - src/app/.venv/
    - src/app/.venv-local/
    - src/app/frontend/node_modules/
    - docs/
    - "*.bak"
    - data/

include:
  - resources/*.yml
