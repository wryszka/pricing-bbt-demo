bundle:
  name: pricing-upt-demo

variables:
  catalog_name:
    description: Unity Catalog name for all demo tables
    default: lr_serverless_aws_us_catalog
  schema_name:
    description: Schema name for all demo tables
    default: pricing_upt
  volume_name:
    description: Volume for landing external data files
    default: external_landing
  entity_name:
    description: Name of the reporting undertaking
    default: "Bricksurance SE"
  warehouse_id:
    description: SQL warehouse used by the app for data queries
    default: "ab79eced8207d29b"
  app_service_principal_id:
    description: Databricks App's service principal (used for CAN_MANAGE_RUN on app-triggered jobs)
    default: "452a9d33-f698-4124-b573-912c6fe6e929"
  genie_space_id:
    description: AI/BI Genie space over the Modelling Mart
    default: "01f134e996251f40bf521eac22ad10f1"
  genie_quote_space_id:
    description: AI/BI Genie space over the quote stream
    default: "01f13e30dcd418ae88295599f23780b8"
  live_online_store_name:
    description: Lakebase online store backing the Live Pricing System (provisioned and torn down on demand)
    default: "pricing-upt-online-store-live"
  live_endpoint_name:
    description: Model Serving endpoint name for the unified pricing scorer (live + production share one endpoint)
    default: "pricing_scorer"
  scale_factor:
    description: |
      Multiplier on the synthetic dataset size (1 = 50k policies, 20 = 1M).
      Prod targets the full 1M policies. Dev defaults to 10 (500k) — the
      largest size that comfortably fits the CU_2 Lakebase tier the live
      pricing system provisions for the demo. Bump if running on CU_4+.
    default: "20"

# Default target points at PROD only as a hard guard — explicitly pass
# `--target dev` for any work-in-progress deploy. Prod is the live demo
# environment; touch it only on cut releases.
targets:
  prod:
    mode: production
    default: true
    workspace:
      host: https://fevm-lr-serverless-aws-us.cloud.databricks.com
      profile: DEFAULT
      # Prod assets live under /Workspace/Shared so the whole org can reach them from one path.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name:        lr_serverless_aws_us_catalog
      warehouse_id:        "ab79eced8207d29b"
      # App SP minted on the 2026-06-01 clean redeploy (old 452a9d33 SP died
      # with the previous app). Genie ids re-wired after recreation below.
      app_service_principal_id: "3da451a3-ebd3-46be-a5fa-13132401d01a"
      genie_space_id:        "01f15d9ed6a61ca18f578f91ad1c76b7"
      genie_quote_space_id:  "01f15d9ed72c1a44aa4e4fe208de54c2"

  dev:
    mode: development
    workspace:
      host: https://fevm-lr-dev-aws-us.cloud.databricks.com
      profile: DEV
    variables:
      catalog_name:        lr_dev_aws_us_catalog
      warehouse_id:        "a3b61648ea4809e3"
      # App SP captured on first dev app creation (2026-05-07).
      app_service_principal_id: "63890164-4191-4196-9682-5248098a59c5"
      # Genie spaces don't exist in dev yet — leave blank so the UI hides them.
      genie_space_id:       ""
      genie_quote_space_id: ""
      # Commercial dataset stays small in dev (50k policies) — the live-serving
      # demo runs on the motor dataset (1M policies in unified_motor_table_live),
      # which is generated by a separate setup_motor job.
      scale_factor:         "1"

sync:
  exclude:
    - src/app/.venv/
    - src/app/frontend/node_modules/
    - docs/
    - "*.bak"
    - data/

include:
  - resources/*.yml
