bundle:
  name: pricing-upt-demo

variables:
  # Template defaults are generic / blank on purpose — every real deployment
  # sets these per target (see the `targets:` block) or via `--var`. A fresh
  # clone should not inherit any one workspace's catalog, warehouse, SP or
  # Genie ids. Workspace-specific ids (warehouse / SP / Genie / dashboard) are
  # blank by default and filled per target; the post-deploy
  # `grant_app_permissions` job discovers the app SP at runtime.
  catalog_name:
    description: Unity Catalog name for all demo tables
    default: pricing_workbench
  schema_name:
    description: Schema name for all demo tables
    default: pricing_upt
  volume_name:
    description: Volume for landing external data files
    default: external_landing
  app_name:
    description: Databricks App name (used by the post-deploy grant_app_permissions job to look up the app SP)
    default: pricing-workbench
  entity_name:
    description: Name of the reporting undertaking
    default: "Bricksurance SE"
  warehouse_id:
    description: SQL warehouse the app uses for data queries — set per target.
    default: ""
  app_service_principal_id:
    description: |
      App service principal (for CAN_MANAGE_RUN on app-triggered jobs). Leave
      blank — the app SP is auto-minted on app creation and the post-deploy
      grant_app_permissions job grants it; set this only if a target needs the
      id wired into a resource before that job runs.
    default: ""
  genie_space_id:
    description: AI/BI Genie space over the Modelling Mart — blank hides the UI until set.
    default: ""
  genie_quote_space_id:
    description: AI/BI Genie space over the quote stream — blank hides the UI until set.
    default: ""
  live_online_store_name:
    description: Lakebase online store backing the Live Pricing System (provisioned and torn down on demand)
    default: "pricing-upt-online-store-live"
  live_endpoint_name:
    description: Model Serving endpoint name for the unified pricing scorer (live + production share one endpoint)
    default: "pricing_scorer"
  scale_factor:
    description: |
      Multiplier on the synthetic dataset size (1 = 50k policies, 20 = 1M).
      Prod targets the full 1M policies. Dev defaults to 10 (500k) — the
      largest size that comfortably fits the CU_2 Lakebase tier the live
      pricing system provisions for the demo. Bump if running on CU_4+.
    default: "20"

# Default target points at PROD only as a hard guard — explicitly pass
# `--target dev` for any work-in-progress deploy. Prod is the live demo
# environment; touch it only on cut releases.
targets:
  prod:
    mode: production
    default: true
    workspace:
      host: https://fevm-lr-serverless-aws-us.cloud.databricks.com
      profile: DEFAULT
      root_path: /Workspace/Users/laurence.ryszka@databricks.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name:        lr_serverless_aws_us_catalog
      warehouse_id:        "ab79eced8207d29b"
      # App SP minted on the 2026-06-01 clean redeploy (old 452a9d33 SP died
      # with the previous app). Genie ids re-wired after recreation below.
      app_service_principal_id: "bf8989e3-3a38-48b5-8a31-67421e6d648b"
      genie_space_id:        "01f15d9ed6a61ca18f578f91ad1c76b7"
      genie_quote_space_id:  "01f15d9ed72c1a44aa4e4fe208de54c2"

  dev:
    mode: development
    workspace:
      host: https://fevm-lr-dev-aws-us.cloud.databricks.com
      profile: DEV
    variables:
      catalog_name:        lr_dev_aws_us_catalog
      warehouse_id:        "a3b61648ea4809e3"
      # App SP captured on first dev app creation (2026-05-07).
      app_service_principal_id: "63890164-4191-4196-9682-5248098a59c5"
      # Genie spaces don't exist in dev yet — leave blank so the UI hides them.
      genie_space_id:       ""
      genie_quote_space_id: ""
      # Commercial dataset stays small in dev (50k policies) — the live-serving
      # demo runs on the motor dataset (1M policies in unified_motor_table_live),
      # which is generated by a separate setup_motor job.
      scale_factor:         "1"

  # ------------------------------------------------------------------
  # Pinchu's clean-redeploy target for v1 reproducibility testing.
  # Additive — does NOT touch prod/dev. Drop once v1 ships.
  # ------------------------------------------------------------------
  pinchu:
    mode: development
    workspace:
      host: https://fevm-pinchudemo.cloud.databricks.com
      profile: fevm-pinchudemo
      # Derive root_path from the deployer (no laurence.ryszka hardcode).
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name:             "pinchudemo_catalog"
      warehouse_id:             "f2f3ec2de0fcaea0"
      # App SP is auto-minted on first `databricks apps deploy`; leave blank.
      app_service_principal_id: ""
      # Genie + dashboard created post-deploy by the setup notebook (Thu 6/4).
      genie_space_id:           ""
      genie_quote_space_id:     ""
      # Smallest dataset so Tue's first deploy verifies the path quickly.
      # Bump to 10 or 20 once the deploy + bug reproduction are confirmed.
      scale_factor:             "1"

sync:
  exclude:
    - src/app/.venv/
    - src/app/frontend/node_modules/
    - docs/
    - "*.bak"
    - data/

include:
  - resources/*.yml
