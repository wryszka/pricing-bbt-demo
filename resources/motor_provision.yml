resources:
  jobs:
    motor_provision:
      name: "Motor live serving: provision (Lakebase + endpoint reconcile)"
      # One run at a time — repeated Activate clicks must not spawn parallel
      # provisions that collide on resuming Lakebase / creating the endpoint.
      max_concurrent_runs: 1
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: online_store_name
          default: "motor-pricing-online-store"
        - name: online_store_capacity
          default: "CU_4"
        - name: endpoint_name
          default: "motor_pricing_scorer"
        - name: app_service_principal_id
          default: ${var.app_service_principal_id}

      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN

      tasks:
        - task_key: provision
          notebook_task:
            notebook_path: ../src/07_serving/live_pricing/motor_provision.py
            base_parameters:
              catalog_name:             "{{job.parameters.catalog_name}}"
              schema_name:              "{{job.parameters.schema_name}}"
              online_store_name:        "{{job.parameters.online_store_name}}"
              online_store_capacity:    "{{job.parameters.online_store_capacity}}"
              endpoint_name:            "{{job.parameters.endpoint_name}}"
              app_service_principal_id: "{{job.parameters.app_service_principal_id}}"
          environment_key: env

      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies:
              - mlflow
              - databricks-feature-engineering
              - databricks-sdk
