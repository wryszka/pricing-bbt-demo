resources:
  jobs:
    motor_pricing_scorer_deploy:
      name: "Deploy motor pricing scorer (Large endpoint)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: endpoint_name
          default: "motor_pricing_scorer"
        - name: deploy_mode
          # "full" also deploys the route-optimized online endpoint (live tier);
          # "direct_only" deploys just the scale-to-zero direct endpoint (Core).
          default: "full"

      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN

      tasks:
        - task_key: deploy
          notebook_task:
            notebook_path: ../src/04_models/production/motor_pricing_scorer.py
            base_parameters:
              catalog_name:  "{{job.parameters.catalog_name}}"
              schema_name:   "{{job.parameters.schema_name}}"
              endpoint_name: "{{job.parameters.endpoint_name}}"
              deploy_mode:   "{{job.parameters.deploy_mode}}"
          environment_key: env

      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies:
              - mlflow
              - databricks-feature-engineering
              - databricks-sdk
              - statsmodels
              - scikit-learn
              - lightgbm
