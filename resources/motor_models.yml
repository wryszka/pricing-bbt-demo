resources:
  jobs:
    train_motor_models:
      name: "Train motor champions (freq + sev + demand + fraud)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}

      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN

      tasks:
        - task_key: freq_glm_motor
          notebook_task:
            notebook_path: ../src/04_models/production/freq_glm_motor.py
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name:  "{{job.parameters.schema_name}}"
          environment_key: env

        - task_key: sev_glm_motor
          notebook_task:
            notebook_path: ../src/04_models/production/sev_glm_motor.py
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name:  "{{job.parameters.schema_name}}"
          environment_key: env

        - task_key: fraud_gbm_motor
          notebook_task:
            notebook_path: ../src/04_models/production/fraud_gbm_motor.py
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name:  "{{job.parameters.schema_name}}"
          environment_key: env

        - task_key: demand_gbm_motor
          notebook_task:
            notebook_path: ../src/04_models/production/demand_gbm_motor.py
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name:  "{{job.parameters.schema_name}}"
          environment_key: env

      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies:
              - databricks-feature-engineering
              - statsmodels
              - scikit-learn
              - lightgbm
              - mlflow
