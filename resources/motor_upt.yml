resources:
  jobs:
    build_motor_upt:
      name: "Build Motor UPT (unified_motor_table_live)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}

      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN

      tasks:
        - task_key: build_motor_upt
          notebook_task:
            notebook_path: ../src/03_gold/build_motor_upt.py
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name:  "{{job.parameters.schema_name}}"
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "5"
