# Inference-log backfill — scores every UPT policy with the 4 current
# champions and writes to {fqn}.inference_logs. Triggered manually (or via
# the app) whenever a promotion changes the champion set.
resources:
  jobs:
    inference_backfill:
      name: "v1 — Inference log backfill (score all UPT policies)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}

      # App SP needs CAN_MANAGE_RUN so the deployment route can fire this on
      # every champion promotion / rollback.
      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN

      tasks:
        - task_key: backfill
          notebook_task:
            notebook_path: ../src/04_models/production/inference_backfill.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name:  ${var.schema_name}
          environment_key: ml_all

      environments:
        - environment_key: ml_all
          spec:
            client: "5"
            dependencies:
              - statsmodels
              - lightgbm
              - scikit-learn
              - mlflow
