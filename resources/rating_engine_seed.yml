# Seed the rating_engine_config table with 3 versions + audit events.
# Idempotent — re-runnable; rewrites the seed state.
resources:
  jobs:
    rating_engine_seed:
      name: "v1 — Rating engine config seed (3 versions)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}

      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN

      tasks:
        - task_key: seed
          notebook_task:
            notebook_path: ../src/04_models/production/rating_engine_seed.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name:  ${var.schema_name}
          environment_key: env
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies: []
